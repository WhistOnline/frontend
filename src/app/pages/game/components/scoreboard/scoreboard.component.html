<div class="table-wrapper">
  <table>
    <thead>
    <tr>
      <th class="name-cell">Player Name</th>
      <th class="number-cell">Bids</th>
      <th class="number-cell">Hands</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let row of getTabularData()">
      <td class="name-cell">{{ row.name }}</td>
      <td class="number-cell">{{ row.bid ?? '-' }}</td>
      <td class="number-cell">{{ row.actual ?? '-' }}</td>
    </tr>
    </tbody>
  </table>
</div>

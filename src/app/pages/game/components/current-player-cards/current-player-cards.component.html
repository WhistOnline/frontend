<div
  class="current-player-cards-container"
>
  <div
    class="current-player-card-wrapper"
    *ngFor="let card of playerCards; index as i"
    cdkDrag
    (cdkDragReleased)="handleDragRelease($event, i)"
    [cdkDragFreeDragPosition]="dragCoordinates[i]"
    [cdkDragDisabled]="!currentPlayerInfo?.isTurn"
  >
    <app-card [suit]="card.suit" [cardIndex]="card.index"></app-card>
  </div>
</div>

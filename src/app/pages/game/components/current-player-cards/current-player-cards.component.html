<div
  class="current-player-cards-container"
>
  <div
    class="current-player-card-wrapper"
    *ngFor="let playableCard of playerCardsWithPlayableInfo; index as i"
    cdkDrag
    (cdkDragReleased)="handleDragRelease($event, i)"
    [cdkDragFreeDragPosition]="dragCoordinates[i]"
    [cdkDragDisabled]="isBid || !currentPlayerInfo?.isTurn || !playableCard.canPlay"
  >
    <app-card [suit]="playableCard.card.suit" [cardIndex]="playableCard.card.index"></app-card>
  </div>
</div>
